{% load wagtailcore_tags wagtailimages_tags %}
<div class="news-item mb-4">
    <div class="row">
        {% if self.image %}
        <div class="col-md-4">
            {% image self.image fill-300x200 class="img-fluid rounded" %}
        </div>
        {% endif %}
        <div class="{% if self.image %}col-md-8{% else %}col-md-12{% endif %}">
            <h6>{{ self.title }}</h6>
            <p class="small text-muted">{{ self.date|date:"d.m.Y" }}</p>
            <div>{{ self.content|richtext }}</div>
        </div>
    </div>
</div>
