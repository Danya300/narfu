{% load wagtailcore_tags %}

<div class="audio-block mb-4 p-3 bg-light rounded">
    {% if self.title %}
    <h5 class="mb-2">{{ self.title }}</h5>
    {% endif %}
    
    {% if self.description %}
    <div class="mb-3 text-muted small">{{ self.description|richtext }}</div>
    {% endif %}
    
    <audio controls class="w-100">
        <source src="{{ self.audio_file.url }}" type="{{ self.audio_file.content_type|default:'audio/mpeg' }}">
        Ваш браузер не поддерживает аудио тег.
    </audio>
    
    <div class="mt-2">
        <a href="{{ self.audio_file.url }}" class="btn btn-sm btn-outline-secondary" download>
            <i class="bi bi-download"></i> Скачать аудио
        </a>
    </div>
</div>
