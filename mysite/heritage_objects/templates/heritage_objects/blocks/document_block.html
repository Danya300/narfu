{% load wagtailcore_tags %}
<div class="document-block mb-4">
    <h4>{{ self.title }}</h4>
    {% if self.description %}
    <div class="mb-3">{{ self.description|richtext }}</div>
    {% endif %}
    {% if self.document %}
    <a href="{{ self.document.url }}" class="btn btn-primary" target="_blank">
        <i class="bi bi-file-earmark-pdf"></i> Скачать PDF
    </a>
    {% endif %}
</div>
